<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Evora — assistente de inteligência artificial pessoal</title>
  <meta name="description" content="Evora, sua assistente de inteligência artificial pessoal, por voz e texto." />
  <meta name="theme-color" content="#020812" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M8 12h48L32 54z' fill='none' stroke='%2353e0ff' stroke-width='5' stroke-linejoin='round'/%3E%3Cpath d='M22 22h20L32 40z' fill='%2353e0ff'/%3E%3C/svg%3E" />
  <link rel="preload" as="image" href="/painel.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body data-state="idle">
  <!--
    A tela é a imagem do painel (painel.webp, 1377×728 na escala original).
    Cada elemento vivo fica por cima do desenho correspondente, posicionado
    pelas coordenadas da imagem original (--x, --y, --w, --h em pixels).
  -->
  <div class="screen" id="screen">
    <img class="backdrop" src="/painel.webp" alt="" aria-hidden="true" />
    <canvas class="ov fx" id="fx" aria-hidden="true" style="--x:0;--y:0;--w:1377;--h:728"></canvas>

    <!-- textos com o nome -->
    <span class="ov version" style="--x:100;--y:14;--w:120;--h:24">EVORA <small>v1.0</small></span>
    <h1 class="ov title" style="--x:600;--y:10;--w:278;--h:46">EVORA</h1>

    <!-- status e relógio -->
    <div class="ov status" id="status" role="status" aria-live="polite" style="--x:1196;--y:49;--w:84;--h:22">
      <span class="dot"></span><span id="statusText">ONLINE</span>
    </div>
    <time class="ov clock" id="clock" style="--x:1296;--y:49;--w:70;--h:22">--:--:--</time>

    <!-- núcleo: reage à voz -->
    <canvas class="ov" id="holo" aria-hidden="true" style="--x:602;--y:-42;--w:640;--h:640"></canvas>
    <strong class="ov ring-name" style="--x:822;--y:268;--w:210;--h:46">EVORA</strong>

    <!-- menu (os botões desenhados ficam clicáveis) -->
    <nav class="menu" aria-label="Menu">
      <button class="ov hot active" data-action="painel" style="--x:30;--y:78;--w:202;--h:44">Painel</button>
      <button class="ov hot" data-action="assistente" style="--x:22;--y:124;--w:202;--h:42">Assistente</button>
      <button class="ov hot" data-action="analises" data-prompt="Analise para mim: " style="--x:22;--y:167;--w:202;--h:42">Análises</button>
      <button class="ov hot" data-action="projetos" data-prompt="Me ajude a planejar o projeto: " style="--x:22;--y:210;--w:202;--h:42">Projetos</button>
      <button class="ov hot" data-action="automacoes" data-prompt="Crie um passo a passo para automatizar: " style="--x:22;--y:254;--w:202;--h:42">Automações</button>
      <button class="ov hot" data-action="aprendizado" data-prompt="Me explique de forma simples: " style="--x:22;--y:298;--w:202;--h:43">Aprendizado</button>
      <button class="ov hot" data-action="config" id="settingsBtn" aria-expanded="false" aria-controls="settings" style="--x:22;--y:342;--w:202;--h:45">Configurações</button>
    </nav>

    <!-- conversa -->
    <section class="ov log-wrap" id="logWrap" style="--x:768;--y:452;--w:362;--h:200">
      <button class="log-toggle" id="logToggle" type="button" aria-label="Ocultar conversa" title="Ocultar conversa">–</button>
      <div class="log" id="log" aria-live="polite" aria-label="Conversa"></div>
    </section>

    <!-- barra de comando -->
    <canvas class="ov wave" id="wave" aria-hidden="true" style="--x:196;--y:663;--w:168;--h:47"></canvas>
    <span class="ov cmd-state" id="cmdState" style="--x:404;--y:671;--w:124;--h:28">EVORA PRONTA</span>
    <form class="ov input-row" id="form" autocomplete="off" style="--x:548;--y:664;--w:704;--h:38">
      <input id="input" type="text" placeholder="Como posso te ajudar hoje?" aria-label="Mensagem para a Evora" maxlength="4000" />
      <button type="button" class="mic" id="micBtn" aria-label="Falar com a Evora" title="Falar (barra de espaço)"></button>
      <button type="button" class="scan" id="scanBtn" aria-label="Mostrar ou ocultar a conversa" title="Mostrar ou ocultar a conversa"></button>
      <button type="submit" class="send" aria-label="Enviar" title="Enviar"></button>
    </form>
  </div>

  <!-- no celular, a conversa e o campo de texto vêm para cá -->
  <div class="dock" id="dock"></div>

  <aside class="settings" id="settings" hidden>
    <h2>Configurações</h2>
    <label class="field">
      <span>Estilo da voz</span>
      <select id="styleSelect">
        <option value="jarvis">Jarvis — IA masculina (Gemini)</option>
        <option value="browser">Voz do navegador (feminina)</option>
      </select>
    </label>
    <label class="toggle">
      <input type="checkbox" id="fxToggle" checked />
      <span>Efeito metálico de IA</span>
    </label>
    <label class="field" id="voiceField">
      <span>Voz do navegador</span>
      <select id="voiceSelect"></select>
    </label>
    <label class="field">
      <span>Velocidade da fala <output id="rateOut">1.0</output></span>
      <input type="range" id="rate" min="0.7" max="1.4" step="0.05" value="1" />
    </label>
    <label class="toggle">
      <input type="checkbox" id="speakToggle" checked />
      <span>Responder em voz alta</span>
    </label>
    <label class="toggle">
      <input type="checkbox" id="convoToggle" />
      <span>Mãos-livres (AUTO-START): fica ouvindo e responde sem apertar nada</span>
    </label>
    <div class="settings-actions">
      <button class="ghost" id="testVoice" type="button">Testar voz</button>
      <button class="ghost danger" id="clearBtn" type="button">Limpar conversa</button>
    </div>
    <p class="hint" id="supportHint"></p>
  </aside>

  <script src="/app.js" type="module"></script>
</body>
</html>
